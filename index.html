<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico?v=4" sizes="any" />
    <link rel="icon" href="/favicon.svg?v=4" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2f2f4" />
    <meta
      name="description"
      content="Wordn00: a word-guessing game like Word500, scored with counts of right, misplaced and wrong letters, where the hidden word can be 3 to 18 letters long and its length is a secret."
    />
    <link rel="apple-touch-icon" href="/logo192.png?v=4" />
    <link rel="manifest" href="/manifest.json" />
    <title>Wordn00</title>
    <script>
      // Apply the theme before first paint; keep in sync with src/lib/theme.ts.
      // Changing this script changes its CSP hash in deploy/nginx.conf.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var dark =
          stored === "dark" ||
          (stored !== "light" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) {
          document.documentElement.classList.add("dark");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#121213");
        }
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to play Wordn00.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
