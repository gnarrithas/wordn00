<!-- The logo: a 2x2 square (white tile, then the hint colours; black letters) inside one black line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" fill="#000000"/>
  <rect x="4" y="4" width="26" height="26" fill="#ffffff"/>
  <rect x="34" y="4" width="26" height="26" fill="#6aaa64"/>
  <rect x="4" y="34" width="26" height="26" fill="#c9b458"/>
  <rect x="34" y="34" width="26" height="26" fill="#d1605a"/>
  <g text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#000000">
    <text x="17" y="23.5">W</text>
    <text x="47" y="23.5">N</text>
    <text x="17" y="53.5">0</text>
    <text x="47" y="53.5">0</text>
  </g>
</svg>
